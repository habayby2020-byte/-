name: Build ASTRO Android APK

# APK builds remain paused; this workflow is run manually after code review.
on:
  push:
    branches: [fix/android-apps-and-mini-app-discovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project and Capacitor Android tooling
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/cli@6.2.1 @capacitor/core@6.2.1 @capacitor/android@6.2.1 typescript@5.6.3

      - name: Build web application and package all installed apps
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/api/apps
          test -s dist/apps-catalogue.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const apps = JSON.parse(fs.readFileSync('dist/api/apps', 'utf8'));
          const fallback = JSON.parse(fs.readFileSync('dist/apps-catalogue.json', 'utf8'));
          const expected = ['quick-note', 'rocket-soccer', 'spider-city'];
          for (const id of expected) {
            const app = apps.find(item => item.id === id);
            const fallbackApp = fallback.find(item => item.id === id);
            if (!app || !fallbackApp) throw new Error('App missing from API/fallback catalogue: ' + id);
            if (app.entry !== fallbackApp.entry) throw new Error('Catalogue mismatch for ' + id);
            if (!fs.existsSync('dist' + app.entry)) throw new Error('App entry missing from dist: ' + app.entry);
            if (app.icon && !fs.existsSync('dist' + app.icon)) throw new Error('App icon missing from dist: ' + app.icon);
          }
          for (const file of [
            'dist/apps/_shared/astro-control-client.js',
            'dist/apps/_shared/vendor/three.js',
            'dist/apps/_shared/vendor/CopyShader.js',
            'dist/apps/_shared/vendor/LuminosityHighPassShader.js',
            'dist/apps/_shared/vendor/ShaderPass.js',
            'dist/apps/_shared/vendor/MaskPass.js',
            'dist/apps/_shared/vendor/RenderPass.js',
            'dist/apps/_shared/vendor/EffectComposer.js',
            'dist/apps/_shared/vendor/UnrealBloomPass.js',
            'dist/apps/rocket-soccer/index.html',
            'dist/apps/spider-city/index.html'
          ]) if (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new Error('Required mini-app asset missing: ' + file);
          NODE
          if grep -R -nE 'https?://(cdnjs.cloudflare.com|cdn.jsdelivr.net)/.*three' apps; then
            echo "Mini-games still depend on an external Three.js CDN." >&2
            exit 1
          fi
          echo "Built app catalogue:"
          cat dist/apps-catalogue.json
          du -sh dist

      - name: Generate Android project
        run: npx cap add android

      - name: Install native Android app and Miracast bridges
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="android/app/src/main/java/com/example/windesktop"
          mkdir -p "$APP_DIR"

          for FILE in MiracastPresentationPlugin InstalledAppsPlugin TvInstalledAppsBridge; do
            case "$FILE" in
              MiracastPresentationPlugin) SOURCE="android-presentation-bridge/$FILE.java" ;;
              *) SOURCE="android-installed-apps-bridge/$FILE.java" ;;
            esac
            test -s "$SOURCE"
            sed '1s/^package com[.]yourapp;/package com.example.windesktop;/' "$SOURCE" > "$APP_DIR/$FILE.java"
          done

          MAIN="$APP_DIR/MainActivity.java"
          cat > "$MAIN" <<'JAVA'
          package com.example.windesktop;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MiracastPresentationPlugin.class);
              registerPlugin(InstalledAppsPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

          # Android 11+ package visibility: explicitly query launcher apps.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          queries = """    <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          """
          if "<queries>" not in s:
              marker = "<application"
              index = s.find(marker)
              if index < 0:
                  raise SystemExit("AndroidManifest.xml has no <application> element")
              s = s[:index] + queries + s[index:]
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "dependencies {"
          if marker not in s:
              raise SystemExit("Could not find dependencies block in android/app/build.gradle")
          if "androidx.webkit:webkit" not in s:
              s = s.replace(marker, marker + '\n    implementation "androidx.webkit:webkit:1.12.1"', 1)
          p.write_text(s)
          PY

          grep -q "registerPlugin(InstalledAppsPlugin.class)" "$MAIN"
          grep -q "<queries>" android/app/src/main/AndroidManifest.xml
          echo "Both native plugins registered; launcher package visibility configured."

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify generated Android integration
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="android/app/src/main/java/com/example/windesktop"
          test -s "$APP_DIR/MiracastPresentationPlugin.java"
          test -s "$APP_DIR/InstalledAppsPlugin.java"
          test -s "$APP_DIR/TvInstalledAppsBridge.java"
          grep -q 'registerPlugin(InstalledAppsPlugin.class)' "$APP_DIR/MainActivity.java"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          queries = root.find("queries")
          if queries is None:
              raise SystemExit("Android package visibility <queries> block is missing")
          actions = [node.attrib.get("{http://schemas.android.com/apk/res/android}name")
                     for node in queries.findall(".//action")]
          categories = [node.attrib.get("{http://schemas.android.com/apk/res/android}name")
                        for node in queries.findall(".//category")]
          if "android.intent.action.MAIN" not in actions:
              raise SystemExit("Launcher MAIN query missing")
          if "android.intent.category.LAUNCHER" not in categories:
              raise SystemExit("Launcher category query missing")
          print("Android manifest package visibility verified.")
          PY

      - name: Build installable Android APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK signature, app catalogue, native bridge and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          for ENTRY in \
            'assets/public/index.html' \
            'assets/public/api/apps' \
            'assets/public/apps-catalogue.json' \
            'assets/public/apps/quick-note/index.html' \
            'assets/public/apps/rocket-soccer/index.html' \
            'assets/public/apps/spider-city/index.html' \
            'assets/public/apps/_shared/astro-control-client.js' \
            'assets/public/apps/_shared/vendor/three.js'; do
            unzip -l "$APK" | grep -Fq "$ENTRY" || { echo "APK is missing $ENTRY" >&2; exit 1; }
          done

          unzip -p "$APK" assets/public/apps-catalogue.json > /tmp/apps-catalogue.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const apps = JSON.parse(fs.readFileSync('/tmp/apps-catalogue.json', 'utf8'));
          for (const id of ['quick-note', 'rocket-soccer', 'spider-city']) {
            if (!apps.some(app => app.id === id)) throw new Error('APK catalogue is missing ' + id);
          }
          console.log('APK app catalogue verified:', apps.map(app => app.id).join(', '));
          NODE

          : > /tmp/astro-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> /tmp/astro-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')
          grep -q 'InstalledAppsPlugin' /tmp/astro-dex-strings.txt
          grep -q 'TvInstalledAppsBridge' /tmp/astro-dex-strings.txt

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/astro-apk-manifest.txt
          grep -q 'android.intent.action.MAIN' /tmp/astro-apk-manifest.txt
          grep -q 'android.intent.category.LAUNCHER' /tmp/astro-apk-manifest.txt

          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
