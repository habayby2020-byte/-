name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Install the project's native Android bridges
        shell: bash
        run: |
          PACKAGE_PATH="com/example/windesktop"
          JAVA_DIR="android/app/src/main/java/$PACKAGE_PATH"
          mkdir -p "$JAVA_DIR"
          for source in MiracastPresentationPlugin DeviceInfoPlugin InstalledAppsPlugin; do
            case "$source" in
              MiracastPresentationPlugin) input="android-presentation-bridge/$source.java" ;;
              DeviceInfoPlugin) input="android-device-info-bridge/$source.java" ;;
              InstalledAppsPlugin) input="android-installed-apps-bridge/$source.java" ;;
            esac
            sed 's/^package com\.yourapp;.*/package com.example.windesktop;/' "$input" > "$JAVA_DIR/$source.java"
          done

          MAIN_ACTIVITY="$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java was not generated by Capacitor" >&2
            exit 1
          fi
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package com.example.windesktop;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MiracastPresentationPlugin.class);
              registerPlugin(DeviceInfoPlugin.class);
              registerPlugin(InstalledAppsPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

          GRADLE_FILE="android/app/build.gradle"
          grep -q "androidx.webkit:webkit" "$GRADLE_FILE" || \
            sed -i "/^dependencies {/a\\    implementation 'androidx.webkit:webkit:1.12.1'" "$GRADLE_FILE"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q '<queries>' "$MANIFEST"; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          queries = """    <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          """
          s = s.replace("<application", queries + "    <application", 1)
          p.write_text(s)
          PY
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
