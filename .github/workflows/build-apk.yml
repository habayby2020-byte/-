name: Build ASTRO Android APK

# APK builds are paused temporarily. Run manually only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project and Capacitor Android tooling
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/cli@6.2.1 @capacitor/core@6.2.1 @capacitor/android@6.2.1 typescript@5.6.3

      - name: Build web application and package all installed apps
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/api/apps
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const apps = JSON.parse(fs.readFileSync('dist/api/apps', 'utf8'));
          for (const id of ['rocket-soccer', 'spider-city']) {
            const app = apps.find(item => item.id === id);
            if (!app) throw new Error('App missing from catalogue: ' + id);
            if (!fs.existsSync('dist' + app.entry)) throw new Error('App entry missing from dist: ' + app.entry);
            if (app.icon && !fs.existsSync('dist' + app.icon)) throw new Error('App icon missing from dist: ' + app.icon);
          }
          for (const file of [
            'dist/apps/_shared/astro-control-client.js',
            'dist/apps/_shared/vendor/three.js',
            'dist/apps/_shared/vendor/CopyShader.js',
            'dist/apps/_shared/vendor/LuminosityHighPassShader.js',
            'dist/apps/_shared/vendor/ShaderPass.js',
            'dist/apps/_shared/vendor/MaskPass.js',
            'dist/apps/_shared/vendor/RenderPass.js',
            'dist/apps/_shared/vendor/EffectComposer.js',
            'dist/apps/_shared/vendor/UnrealBloomPass.js',
            'dist/apps/rocket-soccer/index.html',
            'dist/apps/spider-city/index.html'
          ]) if (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new Error('Required mini-app asset missing: ' + file);
          NODE
          if grep -R -nE 'https?://(cdnjs.cloudflare.com|cdn.jsdelivr.net)/.*three' apps; then
            echo "Mini-games still depend on an external Three.js CDN." >&2
            exit 1
          fi
          echo "Built web assets:"
          du -sh dist
          echo "Packaged mini-app files:"
          find dist/apps -type f | sort
          echo "App catalogue:"
          cat dist/api/apps

      - name: Generate Android project
        run: npx cap add android

      - name: Install Miracast native bridge
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="android/app/src/main/java/com/example/windesktop"
          mkdir -p "$APP_DIR"
          sed '1s/^package com\.yourapp;/package com.example.windesktop;/' \
            android-presentation-bridge/MiracastPresentationPlugin.java \
            > "$APP_DIR/MiracastPresentationPlugin.java"

          MAIN="$APP_DIR/MainActivity.java"
          if [ ! -f "$MAIN" ]; then
            echo "MainActivity.java was not generated by Capacitor" >&2
            exit 1
          fi

          cat > "$MAIN" <<'JAVA'
          package com.example.windesktop;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MiracastPresentationPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "dependencies {"
          if marker not in s:
              raise SystemExit("Could not find dependencies block in android/app/build.gradle")
          if "androidx.webkit:webkit" not in s:
              s = s.replace(marker, marker + '\n    implementation "androidx.webkit:webkit:1.12.1"', 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build installable Android APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK signature and packaged assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          unzip -l "$APK" | grep -q 'assets/public/api/apps'
          unzip -l "$APK" | grep -q 'assets/public/apps/rocket-soccer/index.html'
          unzip -l "$APK" | grep -q 'assets/public/apps/spider-city/index.html'
          unzip -l "$APK" | grep -q 'assets/public/apps/_shared/astro-control-client.js'
          unzip -l "$APK" | grep -q 'assets/public/apps/_shared/vendor/three.js'
          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
