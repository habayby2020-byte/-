name: Build ASTRO TV Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build one installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project and Android build dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1 \
            three@0.128.0

      - name: Bundle all apps and vendor Rocket Soccer engine
        run: node tools/prepare-apk-assets.mjs

      - name: Build web assets
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync bundled app into Android
        run: npx cap sync android

      - name: Install native plugins without changing Miracast implementation
        run: node tools/configure-android-apk.mjs

      - name: Compile a single universal debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cd ..
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ASTRO-TV-Game.apk
          test -s artifacts/ASTRO-TV-Game.apk
          echo "APK size:"
          du -h artifacts/ASTRO-TV-Game.apk
          echo "Checking that the game and local Three.js engine are inside the APK:"
          unzip -l artifacts/ASTRO-TV-Game.apk | grep -E 'assets/public/apps/rocket-soccer/(index.html|three.min.js)'
          unzip -l artifacts/ASTRO-TV-Game.apk | grep -q 'assets/public/api/apps'

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-TV-Game-APK
          path: artifacts/ASTRO-TV-Game.apk
          if-no-files-found: error
          retention-days: 30
