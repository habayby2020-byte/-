name: Build ASTRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "public/**"
      - "android-presentation-bridge/**"
      - "package.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: astro-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project and Capacitor Android tooling
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/cli@6.2.1 @capacitor/core@6.2.1 @capacitor/android@6.2.1 typescript@5.6.3

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Install Miracast native bridge
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="android/app/src/main/java/com/example/windesktop"
          mkdir -p "$APP_DIR"
          sed '1s/^package com\.yourapp;/package com.example.windesktop;/' \
            android-presentation-bridge/MiracastPresentationPlugin.java \
            > "$APP_DIR/MiracastPresentationPlugin.java"

          MAIN="$APP_DIR/MainActivity.java"
          if [ ! -f "$MAIN" ]; then
            echo "MainActivity.java was not generated by Capacitor" >&2
            exit 1
          fi

          cat > "$MAIN" <<'JAVA'
          package com.example.windesktop;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MiracastPresentationPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "dependencies {"
          if marker not in s:
              raise SystemExit("Could not find dependencies block in android/app/build.gradle")
          if "androidx.webkit:webkit" not in s:
              s = s.replace(marker, marker + '\n    implementation "androidx.webkit:webkit:1.12.1"', 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
