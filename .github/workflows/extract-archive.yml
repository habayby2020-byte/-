name: Extract Astro archive

on:
  push:
    paths:
      - 'astro-tv-app.zip'
      - '.github/workflows/extract-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify archive and extract files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="astro-tv-app.zip"
          test -f "$ARCHIVE" || { echo "::error::Archive not found: $ARCHIVE"; exit 1; }
          command -v unzip >/dev/null
          echo "Archive contents:"
          unzip -Z1 "$ARCHIVE"
          if unzip -Z1 "$ARCHIVE" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::Unsafe path detected in ZIP archive."
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ARCHIVE" -d extracted
          echo "Extracted files:"
          find extracted -type f -print | sort
          echo "File count: $(find extracted -type f | wc -l)"
          echo "APK files are only extracted as files; none are installed, launched, or executed."

      - name: Copy project files to repository root
        shell: bash
        run: |
          set -euo pipefail
          # The archive's build workflow is kept out of this automated commit
          # because GitHub App tokens cannot create workflow files.
          rm -rf extracted/.github
          cp -a extracted/. .
          rm -rf extracted
          git add -A -- .
          git reset -- astro-tv-app.zip
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Extract Astro TV app project files"
            git push
          else
            echo "No repository changes to commit."
          fi

      - name: Upload extracted project files
        uses: actions/upload-artifact@v4
        with:
          name: astro-tv-app-extracted-files
          path: extracted/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
