<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1c2c55"/>
      <stop offset="60%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>
    <linearGradient id="carColor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3aa3ff"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- faint stars -->
  <circle cx="90" cy="100" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="420" cy="80" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="440" cy="190" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="70" cy="220" r="2" fill="#ffffff" opacity="0.4"/>

  <!-- orbit ring -->
  <ellipse cx="256" cy="372" rx="150" ry="36" fill="none" stroke="#3aa3ff" stroke-width="6" opacity="0.55"/>

  <!-- ball -->
  <circle cx="340" cy="190" r="46" fill="#f2f2f2"/>
  <g stroke="#2a2a2a" stroke-width="3" opacity="0.8">
    <line x1="300" y1="160" x2="380" y2="160"/>
    <line x1="300" y1="190" x2="380" y2="190"/>
    <line x1="300" y1="220" x2="380" y2="220"/>
    <line x1="318" y1="148" x2="318" y2="232"/>
    <line x1="362" y1="148" x2="362" y2="232"/>
  </g>

  <!-- car -->
  <g>
    <rect x="96" y="300" width="230" height="72" rx="18" fill="url(#carColor)"/>
    <rect x="140" y="270" width="130" height="50" rx="14" fill="url(#carColor)"/>
    <rect x="140" y="312" width="130" height="14" rx="4" fill="#0a0a0c"/>
    <rect x="96" y="332" width="230" height="16" rx="4" fill="#0a0a0c"/>
    <circle cx="150" cy="372" r="26" fill="#111318"/>
    <circle cx="286" cy="372" r="26" fill="#111318"/>
    <rect x="300" y="322" width="18" height="18" fill="#ffffff"/>
    <rect x="104" y="322" width="18" height="18" fill="#ff2222"/>
  </g>
</svg>
