name: Build Android APK (Miracast Presentation)

# يشتغل يدوياً من تبويب Actions بمستودعك، أو تلقائياً مع كل push لفرع main.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (مطلوب لبناء Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install web dependencies
        run: npm install

      - name: Build web app (dist/)
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android

      - name: Add native Android project
        run: npx cap add android

      # --- دمج الإضافة الأصلية الوحيدة: MiracastPresentationPlugin ---
      - name: Copy native plugin Java file into the Android project
        run: |
          set -e
          PKG_DIR="android/app/src/main/java/com/example/windesktop"
          mkdir -p "$PKG_DIR"
          # نحط الباكج الصحيح بدل com.yourapp
          sed 's/^package com\.yourapp;.*/package com.example.windesktop;/' \
            android-presentation-bridge/MiracastPresentationPlugin.java > "$PKG_DIR/MiracastPresentationPlugin.java"
          echo "تم نسخ MiracastPresentationPlugin.java إلى $PKG_DIR"

      - name: Register plugin in MainActivity.java
        run: |
          set -e
          MAIN="android/app/src/main/java/com/example/windesktop/MainActivity.java"
          if [ ! -f "$MAIN" ]; then
            echo "MainActivity.java مو موجود بالمسار المتوقع، وقف البناء." >&2
            exit 1
          fi

          cat > "$MAIN" <<'JAVA_EOF'
          package com.example.windesktop;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MiracastPresentationPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF
          # الملف الناتج فيه مسافات بداية زائدة (من تنسيق YAML) — ما تؤثر
          # على ترجمة الجافا إطلاقاً، بس نرتبه بسرعة عشان القراءة لاحقاً.
          sed -i 's/^          //' "$MAIN"

          grep -q "registerPlugin(MiracastPresentationPlugin.class)" "$MAIN" || { echo "فشل تسجيل الإضافة" >&2; exit 1; }
          echo "--- MainActivity.java ---"
          cat "$MAIN"

      - name: Add androidx.webkit dependency (needed by MiracastPresentationPlugin)
        run: |
          set -e
          GRADLE="android/app/build.gradle"
          if ! grep -q "androidx.webkit:webkit" "$GRADLE"; then
            sed -i '/^dependencies {/a\    implementation "androidx.webkit:webkit:1.10.0"' "$GRADLE"
          fi
          echo "--- app/build.gradle (dependencies) ---"
          grep -A3 "^dependencies {" "$GRADLE"

      - name: Add required permissions to AndroidManifest.xml
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Miracast API (DisplayManager) ما يحتاج أي صلاحية خاصة — بس
          # نضيف صلاحية الإنترنت المعتادة (لتحميل حزمة التطبيق بالتطوير).
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/!s#<manifest[^>]*>#&\n    <uses-permission android:name="android.permission.INTERNET" />#' "$MANIFEST"
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: windesktop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
