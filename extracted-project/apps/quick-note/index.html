<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ملاحظة سريعة</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font-family: system-ui, sans-serif; background:#fffdf4; height:100vh; box-sizing:border-box; display:flex; flex-direction:column; }
  @media (prefers-color-scheme: dark) { body { background:#1c1a10; } textarea { color:#f2e9c9 !important; } }
  textarea { flex:1; border:0; outline:0; resize:none; padding:16px; font-size:16px; line-height:1.6; background:transparent; }
  .bar { padding:8px 16px; font-size:12px; color:#8a7a3a; border-top:1px solid rgba(0,0,0,0.08); }
</style>
</head>
<body>
  <textarea id="note" placeholder="اكتب أي شي هنا... يتحفظ تلقائيًا"></textarea>
  <div class="bar" id="status">جاهز</div>
  <script>
    const ta = document.getElementById('note');
    const status = document.getElementById('status');
    const KEY = 'quick-note-content';
    try { ta.value = localStorage.getItem(KEY) || ''; } catch (e) {}
    let t;
    ta.addEventListener('input', () => {
      status.textContent = 'جاري الحفظ...';
      clearTimeout(t);
      t = setTimeout(() => {
        try { localStorage.setItem(KEY, ta.value); status.textContent = 'انحفظت ✓'; }
        catch (e) { status.textContent = 'تعذّر الحفظ'; }
      }, 300);
    });
  </script>
</body>
</html>
