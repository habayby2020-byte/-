<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدينة التأرجح</title>
<style>
  :root{ --hud-bg:rgba(6,16,12,.7); --fg:#eef7f1; color-scheme:dark; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  #three-root{position:fixed;inset:0;}
  canvas{display:block;}
  .hud{position:fixed;top:env(safe-area-inset-top,0px);left:12px;background:var(--hud-bg);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 14px;color:var(--fg);font-size:12px;z-index:5;
    pointer-events:none;line-height:1.7;}
  .pulse{width:8px;height:8px;border-radius:50%;background:#2ecc71;display:inline-block;margin-left:6px;box-shadow:0 0 6px #2ecc71;}
</style>
</head>
<body>
<div id="three-root"></div>
<div class="hud" id="hud">الاتصال جاهز — بانتظار ربط الأزرار من كودك<span class="pulse"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   الدوال الجاهزة للعبة — نادِها من داخل KEY_ACTIONS / KEY_RELEASE تبعك
   (ما فيه ولا سطر هنا يربط زر معيّن — القرار كله عندك بالأسفل)
   -------------------------------------------------------------------
   PlayerMove.start('forward' | 'back' | 'left' | 'right')
   PlayerMove.stop('forward' | 'back' | 'left' | 'right')
   PlayerMove.sprintOn()   /  PlayerMove.sprintOff()
   PlayerMove.jump()
   PlayerMove.swingToggle()   // يمسك حبل من أقرب برج لو بالمدى، أو يفلت لو ممسوك
   ===================================================================== */

// ========================================================
// اتصال يد تحكم ASTRA (كيبورد + ماوس + يد تحكم) — سطر واحد
// يفعّل استقبال كل الأزرار تلقائيًا. حطه أول شي بكودك.
// ========================================================

window.addEventListener('keydown', e => {
  if (e.repeat) return; // يمنع التكرار التلقائي لو ضل الزر مثبّت
  KEY_ACTIONS[e.code]?.();
});

window.addEventListener('keyup', e => {
  KEY_RELEASE[e.code]?.();
});

// ---- من هنا وطالع: أزرارك إنت، كل سطر = زر ----
const KEY_ACTIONS = {
  // 'KeyR':     () => startEngine(),
  // 'ArrowUp':  () => startMoving(),
  // 'Space':    () => jump(),
};

const KEY_RELEASE = {
  // 'ArrowUp':  () => stopMoving(),
};

(function(){
"use strict";
const root=document.getElementById('three-root');
const hud=document.getElementById('hud');
const W0=()=>window.innerWidth, H0=()=>window.innerHeight;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3f4);
scene.fog=new THREE.Fog(0x8fd3f4, 90, 420);
const camera=new THREE.PerspectiveCamera(58, W0()/H0(), 0.5, 900);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(W0(),H0());
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
root.appendChild(renderer.domElement);
window.addEventListener('resize',()=>{camera.aspect=W0()/H0();camera.updateProjectionMatrix();renderer.setSize(W0(),H0());});

scene.add(new THREE.HemisphereLight(0xcfe9ff,0x33281a,0.9));
const sun=new THREE.DirectionalLight(0xfff3d6,1.1);
sun.position.set(120,180,60); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-160; sun.shadow.camera.right=160; sun.shadow.camera.top=160; sun.shadow.camera.bottom=-160;
sun.shadow.camera.far=500;
sun.shadow.radius=3; sun.shadow.bias=-0.00045;
scene.add(sun);

function skyTexture(){
  const c=document.createElement('canvas'); c.width=4;c.height=256; const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'#2f6fae'); grad.addColorStop(0.55,'#8fd3f4'); grad.addColorStop(1,'#dff2ff');
  g.fillStyle=grad; g.fillRect(0,0,4,256);
  return new THREE.CanvasTexture(c);
}
const sky=new THREE.Mesh(new THREE.SphereGeometry(480,16,16), new THREE.MeshBasicMaterial({map:skyTexture(),side:THREE.BackSide,fog:false}));
scene.add(sky);
function cloud(x,y,z,s){
  const g=new THREE.Group();
  const cm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.75,fog:false});
  for(let i=0;i<4;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(s*(0.6+Math.random()*0.5),8,6), cm);
    p.position.set((Math.random()-0.5)*s*1.8,(Math.random()-0.5)*s*0.3,(Math.random()-0.5)*s*1.2);
    g.add(p);
  }
  g.position.set(x,y,z); scene.add(g);
}
for(let i=0;i<14;i++) cloud((Math.random()-0.5)*380,130+Math.random()*60,(Math.random()-0.5)*380,10+Math.random()*10);

// ---------- ground / streets ----------
function roadTexture(){
  const c=document.createElement('canvas'); c.width=512;c.height=512; const g=c.getContext('2d');
  g.fillStyle='#8a8d91'; g.fillRect(0,0,512,512);
  g.fillStyle='#6b6e72'; g.fillRect(28,0,456,512); g.fillRect(0,28,512,456);
  g.strokeStyle='#ffffff'; g.lineWidth=10; g.setLineDash([34,22]);
  g.beginPath(); g.moveTo(256,0); g.lineTo(256,512); g.stroke();
  g.beginPath(); g.moveTo(0,256); g.lineTo(512,256); g.stroke();
  g.setLineDash([]); g.strokeStyle='#d8dadd'; g.lineWidth=14;
  g.strokeRect(14,14,484,484);
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(16,16);
  return tex;
}
const CITY_HALF=170;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(CITY_HALF*2+60,CITY_HALF*2+60), new THREE.MeshStandardMaterial({map:roadTexture(),roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// ---------- giant tourist city (grid of towers) ----------
const buildings=[];
const buildGeo=new THREE.BoxGeometry(1,1,1);
const palette=[0xd9dbe0,0xc7cdd6,0xb7c6d9,0xe8e2d0,0xcfd8e3,0xa9b6c4];
const mats=palette.map(c=>new THREE.MeshStandardMaterial({color:c,roughness:0.75,metalness:0.08}));
function windowTexture(){
  const c=document.createElement('canvas'); c.width=64;c.height=128; const g=c.getContext('2d');
  g.fillStyle='rgba(0,0,0,0)'; g.fillRect(0,0,64,128);
  g.fillStyle='rgba(255,230,160,.85)';
  for(let y=6;y<128;y+=14) for(let x=4;x<64;x+=12) if(Math.random()<0.55) g.fillRect(x,y,6,8);
  return new THREE.CanvasTexture(c);
}
const glowMats=palette.map(()=>new THREE.MeshStandardMaterial({map:windowTexture(),transparent:true,emissive:0x332200,emissiveIntensity:0.25}));

const BLOCK=26, STREET_GAP=9, GRID=9; // GRID x GRID city blocks
for(let ix=-GRID;ix<=GRID;ix++){
  for(let iz=-GRID;iz<=GRID;iz++){
    const cx=ix*BLOCK, cz=iz*BLOCK;
    if(Math.hypot(cx,cz)<16) continue; // plaza at spawn
    if(Math.random()<0.08) continue; // occasional park/gap
    const footprint=(BLOCK-STREET_GAP)*(0.8+Math.random()*0.15); // wide base, reads as a real building
    const isLandmark=Math.random()<0.06;
    const height= isLandmark ? 42+Math.random()*26 : 10+Math.random()*22;
    const mat=mats[(Math.random()*mats.length)|0];
    const box=new THREE.Mesh(buildGeo, mat);
    box.scale.set(footprint,height,footprint);
    box.position.set(cx,height/2,cz);
    box.castShadow=true; box.receiveShadow=true;
    scene.add(box);
    const win=new THREE.Mesh(new THREE.PlaneGeometry(footprint*0.98,height*0.98), glowMats[(Math.random()*glowMats.length)|0]);
    win.position.set(cx, height/2, cz+footprint/2+0.05); scene.add(win);
    buildings.push({x:cx,z:cz,half:footprint/2,height});
    if(isLandmark){
      const topFoot=footprint*0.55, topH=height*0.35;
      const top=new THREE.Mesh(buildGeo, mat);
      top.scale.set(topFoot,topH,topFoot); top.position.set(cx,height+topH/2,cz);
      top.castShadow=true; scene.add(top);
      buildings.push({x:cx,z:cz,half:topFoot/2,height:height+topH});
    }
  }
}

// ---------- player (reuse capsule-based figure) ----------
function capsule(radius,length,segs,mat){
  const grp=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,length,segs), mat);
  const capT=new THREE.Mesh(new THREE.SphereGeometry(radius,segs,Math.max(6,segs/2),0,6.3,0,Math.PI/2), mat); capT.position.y=length/2;
  const capB=new THREE.Mesh(new THREE.SphereGeometry(radius,segs,Math.max(6,segs/2),0,6.3,Math.PI/2,Math.PI/2), mat); capB.position.y=-length/2;
  grp.add(body,capT,capB); grp.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  return grp;
}
function limbPivot(ox,oy,length,radius,mat){
  const pivot=new THREE.Group(); pivot.position.set(ox,oy,0);
  const seg=capsule(radius,length,10,mat); seg.position.y=-length/2; pivot.add(seg);
  return pivot;
}
// شخصية مبسّطة جداً: جسم كبسولي واحد + قناع عام بسيط (ليس نسخة من أي شخصية محمية)
function maskTexture(){
  const c=document.createElement('canvas'); c.width=128;c.height=128; const g=c.getContext('2d');
  g.fillStyle='#b4232f'; g.fillRect(0,0,128,128);
  g.fillStyle='#17181c';
  g.beginPath(); g.ellipse(64,40,34,22,0,0,6.3); g.fill(); g.globalCompositeOperation='destination-out';
  g.fillStyle='#fff';
  g.beginPath(); g.ellipse(42,38,16,11,0.25,0,6.3); g.fill();
  g.beginPath(); g.ellipse(86,38,16,11,-0.25,0,6.3); g.fill();
  g.globalCompositeOperation='source-over';
  g.fillStyle='#fff';
  g.beginPath(); g.ellipse(42,38,16,11,0.25,0,6.3); g.fill();
  g.beginPath(); g.ellipse(86,38,16,11,-0.25,0,6.3); g.fill();
  return new THREE.CanvasTexture(c);
}
const suitMat=new THREE.MeshStandardMaterial({color:0x2535a8,roughness:0.6});
const maskMat=new THREE.MeshStandardMaterial({map:maskTexture(),roughness:0.55});
const playerGroup=new THREE.Group();
const torso=capsule(0.34,0.62,14,suitMat); torso.position.y=1.08; playerGroup.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,18,16), maskMat); head.position.y=1.78; head.castShadow=true; playerGroup.add(head);
const legPivotL=limbPivot(-0.17,0.78,0.72,0.16,suitMat), legPivotR=limbPivot(0.17,0.78,0.72,0.16,suitMat);
const armPivotL=limbPivot(-0.42,1.42,0.52,0.12,suitMat), armPivotR=limbPivot(0.42,1.42,0.52,0.12,suitMat);
playerGroup.add(legPivotL,legPivotR,armPivotL,armPivotR);
scene.add(playerGroup);

function shadowBlobTexture(){
  const c=document.createElement('canvas'); c.width=128;c.height=128; const g=c.getContext('2d');
  const grad=g.createRadialGradient(64,64,4,64,64,62);
  grad.addColorStop(0,'rgba(0,0,0,.45)'); grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const contactShadow=new THREE.Mesh(new THREE.CircleGeometry(0.55,20), new THREE.MeshBasicMaterial({map:shadowBlobTexture(),transparent:true,depthWrite:false}));
contactShadow.rotation.x=-Math.PI/2; contactShadow.position.y=0.03; scene.add(contactShadow);

// rope visual
const ropeGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
const ropeLine=new THREE.Line(ropeGeo, new THREE.LineBasicMaterial({color:0xffffff}));
ropeLine.visible=false; scene.add(ropeLine);

// ---------- player physics state ----------
const player={x:0,y:0,z:0,vx:0,vy:0,vz:0,yaw:0,grounded:true,sprint:false,walk:0};
const move={forward:false,back:false,left:false,right:false};
let swinging=false, swingAnchor=null, ropeLen=0;
const GRAVITY=26, GROUND_Y=0, JUMP_V=10.5;

function nearestBuildingAnchor(){
  let best=null,bd=Infinity;
  for(const b of buildings){
    const dx=b.x-player.x, dz=b.z-player.z, d=Math.hypot(dx,dz);
    if(d<bd && d<55 && b.height>player.y+6){ bd=d; best=b; }
  }
  if(!best) return null;
  const dir=Math.atan2(best.z-player.z, best.x-player.x);
  const ax=best.x-Math.cos(dir)*(best.half+1), az=best.z-Math.sin(dir)*(best.half+1);
  const ay=Math.min(best.height-2, player.y+28+Math.random()*10);
  return {x:ax,y:ay,z:az};
}

const PlayerMove={
  start(dir){ if(dir in move) move[dir]=true; },
  stop(dir){ if(dir in move) move[dir]=false; },
  sprintOn(){ player.sprint=true; },
  sprintOff(){ player.sprint=false; },
  jump(){ if(player.grounded && !swinging){ player.vy=JUMP_V; player.grounded=false; } },
  swingToggle(){
    if(swinging){ swinging=false; ropeLine.visible=false; return; }
    const a=nearestBuildingAnchor();
    if(a){ swingAnchor=a; ropeLen=Math.hypot(a.x-player.x,a.y-player.y,a.z-player.z); swinging=true; player.grounded=false; ropeLine.visible=true; }
  }
};
window.PlayerMove=PlayerMove;
window.addEventListener('message',(ev)=>{ const d=ev.data; if(d&&d.__gameInput&&d.payload&&d.payload.action&&PlayerMove[d.payload.action]) PlayerMove[d.payload.action](d.payload.arg); });

// ---------- camera (third-person chase) ----------
let camYaw=0, camFov=58, camT=0;
function updateCamera(dt,speed){
  const targetYaw=player.yaw;
  let diff=targetYaw-camYaw; while(diff>Math.PI)diff-=6.283; while(diff<-Math.PI)diff+=6.283;
  camYaw+=diff*Math.min(1,dt*4);
  camT+=dt;
  const back=7.5, height=3.6;
  const sway=Math.sin(camT*9)*Math.min(1,speed/9.5)*0.05;
  const cx=player.x-Math.cos(camYaw)*back + Math.cos(camYaw+Math.PI/2)*sway;
  const cz=player.z-Math.sin(camYaw)*back + Math.sin(camYaw+Math.PI/2)*sway;
  camera.position.lerp(new THREE.Vector3(cx,player.y+height,cz), Math.min(1,dt*6));
  camera.lookAt(player.x, player.y+1.4, player.z);
  const targetFov=58+Math.min(1,speed/9.5)*9;
  camFov+=(targetFov-camFov)*Math.min(1,dt*4);
  if(Math.abs(camera.fov-camFov)>0.05){ camera.fov=camFov; camera.updateProjectionMatrix(); }
}

// ---------- update loop ----------
let landSquash=0;
function update(dt){
  const dirX=(move.right?1:0)-(move.left?1:0);
  const dirZ=(move.back?1:0)-(move.forward?1:0);
  const hasInput=dirX||dirZ;
  const wasGrounded=player.grounded;

  if(swinging){
    player.vy-=GRAVITY*dt;
    player.x+=player.vx*dt; player.y+=player.vy*dt; player.z+=player.vz*dt;
    const dx=player.x-swingAnchor.x, dy=player.y-swingAnchor.y, dz=player.z-swingAnchor.z;
    const d=Math.hypot(dx,dy,dz)||0.001;
    const nx=dx/d,ny=dy/d,nz=dz/d;
    player.x=swingAnchor.x+nx*ropeLen; player.y=swingAnchor.y+ny*ropeLen; player.z=swingAnchor.z+nz*ropeLen;
    const vDotN=player.vx*nx+player.vy*ny+player.vz*nz;
    player.vx-=nx*vDotN; player.vy-=ny*vDotN; player.vz-=nz*vDotN;
    if(player.y<=GROUND_Y+0.1){ player.y=GROUND_Y; swinging=false; ropeLine.visible=false; player.grounded=true; player.vy=0; }
    ropeGeo.setFromPoints([new THREE.Vector3(swingAnchor.x,swingAnchor.y,swingAnchor.z), new THREE.Vector3(player.x,player.y+1.4,player.z)]);
  } else {
    const speed=(player.sprint?9.5:5.5);
    if(hasInput){
      const camForwardX=Math.cos(camYaw), camForwardZ=Math.sin(camYaw);
      const camRightX=Math.cos(camYaw-Math.PI/2), camRightZ=Math.sin(camYaw-Math.PI/2);
      const mx=camForwardX*(-dirZ)+camRightX*dirX, mz=camForwardZ*(-dirZ)+camRightZ*dirX;
      const ml=Math.hypot(mx,mz)||1;
      player.vx=(mx/ml)*speed; player.vz=(mz/ml)*speed;
      player.yaw=Math.atan2(mz,mx);
      player.walk+=dt*8*(player.sprint?1.6:1);
    } else { player.vx*=0.8; player.vz*=0.8; player.walk*=0.9; }
    player.vy-=GRAVITY*dt;
    player.x+=player.vx*dt; player.y+=player.vy*dt; player.z+=player.vz*dt;
    if(player.y<=GROUND_Y){ player.y=GROUND_Y; player.vy=0; player.grounded=true; }
  }
  if(!wasGrounded && player.grounded) landSquash=1;
  landSquash*=0.85;
  player.x=Math.max(-CITY_HALF,Math.min(CITY_HALF,player.x));
  player.z=Math.max(-CITY_HALF,Math.min(CITY_HALF,player.z));

  playerGroup.position.set(player.x,player.y,player.z);
  playerGroup.rotation.y=-player.yaw+Math.PI/2;
  playerGroup.scale.set(1+landSquash*0.14, 1-landSquash*0.28, 1+landSquash*0.14);
  const s=Math.sin(player.walk)*0.45;
  legPivotL.rotation.x=s; legPivotR.rotation.x=-s;
  armPivotL.rotation.x=-s; armPivotR.rotation.x=s;

  contactShadow.position.set(player.x,0.03,player.z);
  const heightOff=Math.max(0,player.y);
  const fade=Math.max(0.1,1-heightOff/18);
  contactShadow.scale.setScalar(fade);
  contactShadow.material.opacity=fade;

  updateCamera(dt, Math.hypot(player.vx,player.vz));
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
camera.position.set(0,5,8); camera.lookAt(0,1,0);
requestAnimationFrame(loop);
console.info('[spider-city] جاهز. استخدم window.PlayerMove.* داخل KEY_ACTIONS/KEY_RELEASE لربط أزرارك.');
})();
</script>
</body>
</html>
